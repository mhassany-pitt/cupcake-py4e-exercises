locale: en-US
id: 05-09__iteration__exercises02
title: "Min and Max of User Input"
description: "Prompt for numbers until 'done' and print maximum and minimum."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["loops", "conditionals"]
  topics: ["loops", "while-loop", "min-max-pattern"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program that prompts for a list of numbers until 'done' and at the end prints out both maximum and minimum.
executions:
  - title: Execution 1
    stdin:
      - "7"
      - "2"
      - "done"
    stdout: |-
      Enter a number: Enter a number: Enter a number: Maximum: 7.0
      Minimum: 2.0
    console: |-
      Maximum: 7.0
      Minimum: 2.0
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        maximum = None
        minimum = None
        while True:
            user_input = input("Enter a number: ")
            if user_input == "done":
                break
            try:
                number = float(user_input)
            except ValueError:
                print("Invalid input")
                continue
            if maximum is None or number > maximum:
                maximum = number
            if minimum is None or number < minimum:
                minimum = number
        print("Maximum:", maximum)
        print("Minimum:", minimum)
    placeholder: |-
      # Track max and min using a loop
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "7"
      - "2"
      - "done"
    stdout: |-
      Enter a number: Enter a number: Enter a number: Maximum: 7.0
      Minimum: 2.0
    console: |-
      Maximum: 7.0
      Minimum: 2.0
