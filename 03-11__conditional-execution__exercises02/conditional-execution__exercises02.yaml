$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.py
license: MIT
locale: en-US
id: 03-11__conditional-execution__exercises02
title: "Safe Pay Computation with Try/Except"
description: "Rewrite pay program using try/except to handle non-numeric input gracefully."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["conditionals"]
  topics: ["conditionals", "try-except", "error-handling"]
runtime:
  language: python
  version: 3
statement: |-
  Rewrite your pay program using `try` and `except` so that your program handles non-numeric input gracefully by printing a message and exiting the program.
elements:
  - type: editable
    location:
      snippet: |-
        try:
            hours = float(input("Enter Hours: "))
            rate = float(input("Enter Rate: "))
        except:
            print("Error, please enter numeric input")
            quit()
        
        if hours > 40:
            pay = 40 * rate + (hours - 40) * rate * 1.5
        else:
            pay = hours * rate
        print("Pay:", pay)
    placeholder: |-
      # Implement try/except block for numeric inputs
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "20"
      - "nine"
    stdout: |-
      Enter Hours: Enter Rate: Error, please enter numeric input
    console: |-
      Error, please enter numeric input
  - title: Testcase 2
    visible: true
    stdin:
      - "40"
      - "10"
    stdout: |-
      Enter Hours: Enter Rate: Pay: 400.0
    console: |-
      Pay: 400.0
