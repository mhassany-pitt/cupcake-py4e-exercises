  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["lists", "file-io"]
  topics: ["lists", "string-splitting", "file-io"]
runtime:
  language: python
  version: 3
statement: |-
  Parse 'From ' lines from a mail log file, print the sender email (2nd word), and output total count of From lines.
elements:
  - type: editable
    location:
      snippet: |-
        filename = input("Enter a file name: ")
        fhandle = open(filename)
        count = 0
        for line in fhandle:
            line = line.rstrip()
            if line.startswith("From "):
                words = line.split()
                print(words[1])
                count = count + 1
        print("There were", count, "lines in the file with From as the first word")
    placeholder: |-
      # Extract sender emails and print total count
