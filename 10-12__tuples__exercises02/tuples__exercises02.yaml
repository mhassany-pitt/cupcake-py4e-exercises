statement: |-
  Count distribution of hours of day for messages in mail log and print hour counts sorted by hour.
executions:
  - title: Execution 1
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter a file name: ...
    console: |-
      ...
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        fname = input("Enter a file name: ")
        fhandle = open(fname)
        counts = {}
        for line in fhandle:
            if not line.startswith("From "):
                continue
            words = line.split()
            time = words[5]
            hour = time.split(":")[0]
            counts[hour] = counts.get(hour, 0) + 1
        for hour in sorted(counts):
            print(hour, counts[hour])
    placeholder: |-
      # Extract hour and print sorted counts
