id: 10-12__tuples__exercises01
title: "Top Email Sender using Tuples"
description: "Create list of (count, email) tuples from dictionary, sort in reverse, and print top sender."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["tuples", "dictionaries"]
  topics: ["tuples", "sorting", "dictionaries"]
runtime:
  language: python
  version: 3
statement: |-
  Read 'From ' lines, build email count dictionary, transform to (count, email) tuples, sort in reverse, and print top sender.
executions:
  - title: Execution 1
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter a file name: cwen@iupui.edu 5
    console: |-
      cwen@iupui.edu 5
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        fname = input("Enter a file name: ")
        fhandle = open(fname)
        counts = {}
        for line in fhandle:
            if line.startswith("From "):
                words = line.split()
                email = words[1]
                counts[email] = counts.get(email, 0) + 1
        lst = []
        for email, count in counts.items():
            lst.append((count, email))
        lst.sort(reverse=True)
        count, email = lst[0]
        print(email, count)
    placeholder: |-
      # Sort (count, email) tuples and print top sender
