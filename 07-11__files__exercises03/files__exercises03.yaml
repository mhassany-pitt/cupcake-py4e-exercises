id: 07-11__files__exercises03
title: "File Reader with Easter Egg"
description: "Print funny message when user types 'na na boo boo', otherwise count Subject lines."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["file-io", "try-except"]
  topics: ["file-io", "error-handling", "conditionals"]
runtime:
  language: python
  version: 3
statement: |-
  Modify file reader program so that entering 'na na boo boo' prints an Easter egg message. Otherwise count lines starting with 'Subject:'.
executions:
  - title: Execution 1
    stdin:
      - "na na boo boo"
    stdout: |-
      Enter the file name: NA NA BOO BOO TO YOU - You have been punk'd!
    console: |-
      NA NA BOO BOO TO YOU - You have been punk'd!
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        file_name = input("Enter the file name: ")
        if file_name == "na na boo boo":
            print("NA NA BOO BOO TO YOU - You have been punk'd!")
        else:
            try:
                with open(file_name) as file:
                    subject_count = 0
                    for line in file:
                        if line.startswith("Subject:"):
                            subject_count += 1
                print("There were", subject_count, "subject lines in", file_name)
            except FileNotFoundError:
                print("File cannot be opened:", file_name)
    placeholder: |-
      # Prompt for file and handle Easter Egg
