$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.py
license: MIT
locale: en-US
id: 07-11__files__exercises02
title: "Compute Average Spam Confidence from File"
description: "Prompt for file name, find lines starting with X-DSPAM-Confidence:, and average their values."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["file-io", "strings"]
  topics: ["file-io", "strings", "aggregation"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program to prompt for a file name, find lines starting with 'X-DSPAM-Confidence:', extract numbers, and print average spam confidence.
executions:
  - title: Execution 1
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter the file name: Average spam confidence: 0.7507185185185187
    console: |-
      Average spam confidence: 0.7507185185185187
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        file_name = input("Enter the file name: ")
        fhand = open(file_name)
        total = 0.0
        count = 0
        for line in fhand:
            if line.startswith("X-DSPAM-Confidence:"):
                total = total + float(line.split(":")[1])
                count = count + 1
        print("Average spam confidence:", total / count)
    placeholder: |-
      # Read file and average spam confidence lines
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter the file name: Average spam confidence: 0.7507185185185187
    console: |-
      Average spam confidence: 0.7507185185185187
