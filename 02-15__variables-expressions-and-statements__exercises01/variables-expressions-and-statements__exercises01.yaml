$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.py
license: MIT
locale: en-US
id: 02-15__variables-expressions-and-statements__exercises01
title: "Prompt and Welcome User"
description: "Write a program that uses input to prompt a user for their name and then welcomes them."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics: ["variables"]
  topics: ["variables", "input", "output"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program that uses `input` to prompt a user for their name and then welcomes them.
  
  Desired output format:
  ```text
  Enter your name: Chuck
  Hello Chuck
  ```
elements:
  - type: editable
    location:
      snippet: |-
        name = input("Enter your name: ")
        print("Hello", name)
    placeholder: |-
      # Prompt user for their name and print a welcome message
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "Chuck"
    stdout: |-
      Enter your name: Hello Chuck
    console: |-
      Hello Chuck
  - title: Testcase 2
    visible: true
    stdin:
      - "Alice"
    stdout: |-
      Enter your name: Hello Alice
    console: |-
      Hello Alice
