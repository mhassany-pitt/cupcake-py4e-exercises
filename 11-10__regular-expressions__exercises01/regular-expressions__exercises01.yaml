statement: |-
  Simulate 'grep' command: prompt user for a regex pattern and count matching lines in mbox.txt.
executions:
  - title: Execution 1
    stdin:
      - "^Author"
    stdout: |-
      Enter a regular expression: mbox.txt had 1798 lines that matched ^Author
    console: |-
      mbox.txt had 1798 lines that matched ^Author
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        import re
        regex = input("Enter a regular expression: ")
        count = 0
        for line in open("mbox.txt"):
            if re.search(regex, line):
                count = count + 1
        print("mbox.txt had", count, "lines that matched", regex)
    placeholder: |-
      # Use re.search to count matching lines
