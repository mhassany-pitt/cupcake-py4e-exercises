locale: en-US
id: 05-09__iteration__exercises01
title: "Accumulate Input Until Done"
description: "Repeatedly read integers until 'done', then print total, count, and average."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["loops", "conditionals"]
  topics: ["loops", "while-loop", "try-except", "accumulator"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program which repeatedly reads integers until the user enters 'done'. Once 'done' is entered, print out total, count, and average.
executions:
  - title: Execution 1
    stdin:
      - "4"
      - "5"
      - "bad data"
      - "7"
      - "done"
    stdout: |-
      Enter a number: Enter a number: Enter a number: Invalid input
      Enter a number: Enter a number: 16 3 5.333333333333333
    console: |-
      Invalid input
      16 3 5.333333333333333
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        total = 0
        count = 0
        while True:
            user_input = input("Enter a number: ")
            if user_input == "done":
                break
            try:
                number = int(user_input)
                total += number
                count += 1
            except ValueError:
                print("Invalid input")
        
        print(total, count, total / count)
    placeholder: |-
      # Loop until done and compute stats
testcases:
  - title: Testcase 1
    visible: true
    stdin:
