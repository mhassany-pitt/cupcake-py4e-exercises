title: "Compute Gross Pay"
description: "Prompt user for hours and rate per hour to compute gross pay."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics: ["variables", "expressions"]
  topics: ["variables", "expressions", "input", "output"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program to prompt the user for hours and rate per hour to compute gross pay.
executions:
  - title: Execution 1
    stdin:
      - "35"
      - "2.75"
    stdout: |-
      Enter Hours: Enter Rate: Pay: 96.25
    console: |-
      Pay: 96.25
    status: pass
  - title: Execution 2
    stdin:
      - "40"
      - "10"
    stdout: |-
      Enter Hours: Enter Rate: Pay: 400.0
    console: |-
      Pay: 400.0
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        hours = float(input("Enter Hours: "))
        rate = float(input("Enter Rate: "))
        pay = hours * rate
        print("Pay:", pay)
    placeholder: |-
      # Prompt for hours and rate, then compute pay
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "35"
      - "2.75"
    stdout: |-
      Enter Hours: Enter Rate: Pay: 96.25
    console: |-
      Pay: 96.25
  - title: Testcase 2
    visible: true
