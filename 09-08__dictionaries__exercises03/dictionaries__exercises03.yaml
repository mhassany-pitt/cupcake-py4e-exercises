  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["dictionaries", "loops"]
  topics: ["dictionaries", "max-loop", "aggregation"]
runtime:
  language: python
  version: 3
statement: |-
  Find who sent the most messages in a mail log by iterating over the dictionary of email counts.
executions:
  - title: Execution 1
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter a file name: cwen@iupui.edu 5
    console: |-
      cwen@iupui.edu 5
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        filename = input("Enter a file name: ")
        fhandle = open(filename)
        email_counts = {}
        for line in fhandle:
            if line.startswith("From "):
                words = line.split()
                email = words[1]
                email_counts[email] = email_counts.get(email, 0) + 1
        
        bigcount = None
        bigemail = None
        for email, count in email_counts.items():
            if bigcount is None or count > bigcount:
                bigcount = count
                bigemail = email
        print(bigemail, bigcount)
    placeholder: |-
      # Find and print email with maximum count
