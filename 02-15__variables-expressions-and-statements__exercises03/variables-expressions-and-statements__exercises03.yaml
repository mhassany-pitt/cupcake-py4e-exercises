id: 02-15__variables-expressions-and-statements__exercises03
title: "Celsius to Fahrenheit Converter"
description: "Prompt user for Celsius temperature, convert to Fahrenheit, and print."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics: ["variables", "expressions"]
  topics: ["variables", "expressions", "conversion"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program which prompts the user for a Celsius temperature, convert the temperature to Fahrenheit, and print out the converted temperature.
executions:
  - title: Execution 1
    stdin:
      - "0"
    stdout: |-
      Enter temperature in Celsius: Temperature in Fahrenheit: 32.0
    console: |-
      Temperature in Fahrenheit: 32.0
    status: pass
  - title: Execution 2
    stdin:
      - "100"
    stdout: |-
      Enter temperature in Celsius: Temperature in Fahrenheit: 212.0
    console: |-
      Temperature in Fahrenheit: 212.0
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        celsius = float(input("Enter temperature in Celsius: "))
        fahrenheit = celsius * 9 / 5 + 32
        print("Temperature in Fahrenheit:", fahrenheit)
    placeholder: |-
      # Read Celsius temperature and convert to Fahrenheit
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "0"
    stdout: |-
      Enter temperature in Celsius: Temperature in Fahrenheit: 32.0
    console: |-
      Temperature in Fahrenheit: 32.0
  - title: Testcase 2
    visible: true
    stdin:
      - "100"
    stdout: |-
      Enter temperature in Celsius: Temperature in Fahrenheit: 212.0
    console: |-
      Temperature in Fahrenheit: 212.0
