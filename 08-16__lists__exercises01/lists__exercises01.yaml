id: 08-16__lists__exercises01
title: "Find Unique Words in Romeo.txt"
description: "Read romeo.txt line by line, split into words, store unique words in a list, sort and print."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["lists", "file-io"]
  topics: ["lists", "file-io", "sorting", "uniqueness"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program to open a file and read line by line. Split lines into words, collect unique words, sort and print them alphabetically.
executions:
  - title: Execution 1
    stdin:
      - "romeo.txt"
    stdout: |-
      Enter file: ['Arise', 'But', 'It', 'Juliet', 'Who', 'already', 'and', 'breaks', 'east', 'envious', 'fair', 'grief', 'is', 'kill', 'light', 'moon', 'pale', 'sick', 'soft', 'sun', 'the', 'through', 'what', 'window', 'with', 'yonder']
    console: |-
      ['Arise', 'But', 'It', 'Juliet', 'Who', 'already', 'and', 'breaks', 'east', 'envious', 'fair', 'grief', 'is', 'kill', 'light', 'moon', 'pale', 'sick', 'soft', 'sun', 'the', 'through', 'what', 'window', 'with', 'yonder']
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        filename = input("Enter file: ")
        fhandle = open(filename)
        unique_words = []
        for line in fhandle:
            words = line.split()
            for word in words:
                if word not in unique_words:
                    unique_words.append(word)
        unique_words.sort()
        print(unique_words)
    placeholder: |-
      # Collect unique words from file and print sorted list
