elements:
  - type: editable
    location:
      snippet: |-
        import socket
        import sys
        url = input("Enter URL: ")
        try:
            parts = url.split('/')
            host = parts[2]
            path = '/' + '/'.join(parts[3:])
            mysock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            mysock.connect((host, 80))
        except Exception as e:
            sys.exit("Error: " + str(e))
        cmd = f"GET {path} HTTP/1.0\r\nHost: {host}\r\n\r\n"
        mysock.send(cmd.encode())
        data = b""
        while True:
            msg = mysock.recv(512)
            if len(msg) < 1:
                break
            data = data + msg
        text = data.decode()
        pos = text.find("\r\n\r\n")
        if pos >= 0:
            print(text[pos + 4:])
        mysock.close()
    placeholder: |-
      # Strip HTTP headers and print body text
