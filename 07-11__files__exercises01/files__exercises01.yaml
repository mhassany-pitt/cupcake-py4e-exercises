statement: |-
  Write a program to read through a file and print the contents of the file (line by line) all in upper case.
executions:
  - title: Execution 1
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter a file name: ...
    console: |-
      ...
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        file_name = input("Enter a file name: ")
        fhand = open(file_name)
        for line in fhand:
            print(line.rstrip().upper())
    placeholder: |-
      # Open file and print uppercase lines
