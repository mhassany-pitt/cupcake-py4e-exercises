id: 06-14__strings__exercises01
title: "Extract Floating-Point Number from String"
description: "Use find and string slicing to extract floating point value after colon."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics: ["strings"]
  topics: ["strings", "slicing", "string-methods"]
runtime:
  language: python
  version: 3
statement: |-
  Take `data = 'X-DSPAM-Confidence: 0.8475'`. Use `find` and string slicing to extract portion after colon, convert to float, and print.
executions:
  - title: Execution 1
    stdin: []
    stdout: |-
      0.8475
    console: |-
      0.8475
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        data = 'X-DSPAM-Confidence: 0.8475'
        colon_position = data.find(':')
        number_str = data[colon_position + 1:].strip()
        confidence = float(number_str)
        print(confidence)
    placeholder: |-
      data = 'X-DSPAM-Confidence: 0.8475'
      # Extract and print float confidence value
testcases:
  - title: Testcase 1
    visible: true
    stdin: []
    stdout: |-
      0.8475
    console: |-
      0.8475
