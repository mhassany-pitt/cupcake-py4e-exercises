$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/free-coding/0.1.0
source: main.py
license: MIT
locale: en-US
id: 03-11__conditional-execution__exercises03
title: "Grade Calculator"
description: "Prompt for score between 0.0 and 1.0 and print grade letter (A, B, C, D, F) or error message."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["conditionals"]
  topics: ["conditionals", "if-elif-else", "error-handling"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program to prompt for a score between 0.0 and 1.0. If score is out of range or non-numeric, print 'Bad score'. Otherwise print grade: >=0.9 A, >=0.8 B, >=0.7 C, >=0.6 D, <0.6 F.
executions:
  - title: Execution 1
    stdin:
      - "0.95"
    stdout: |-
      Enter score: A
    console: |-
      A
    status: pass
  - title: Execution 2
    stdin:
      - "10.0"
    stdout: |-
      Enter score: Bad score
    console: |-
      Bad score
    status: pass
elements:
  - type: editable
    location:
      snippet: |-
        try:
            score = float(input("Enter score: "))
        except:
            print("Bad score")
            quit()
        
        if score < 0.0 or score > 1.0:
            print("Bad score")
        elif score >= 0.9:
            print("A")
        elif score >= 0.8:
            print("B")
        elif score >= 0.7:
            print("C")
        elif score >= 0.6:
            print("D")
        else:
            print("F")
    placeholder: |-
      # Prompt for score and print letter grade
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "0.95"
    stdout: |-
      Enter score: A
    console: |-
      A
  - title: Testcase 2
    visible: true
    stdin:
      - "10.0"
    stdout: |-
      Enter score: Bad score
    console: |-
      Bad score
