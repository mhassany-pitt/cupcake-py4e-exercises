pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["networking"]
  topics: ["networking", "urllib", "http"]
runtime:
  language: python
  version: 3
statement: |-
  Use `urllib` to retrieve document from URL, display up to 3000 characters, and print overall character count.
elements:
  - type: editable
    location:
      snippet: |-
        import urllib.request
        url = input("Enter URL: ")
        fhand = urllib.request.urlopen(url)
        count = 0
        for line in fhand:
            text = line.decode()
            if count < 3000:
                remain = 3000 - count
                print(text[:remain], end="")
            count = count + len(text)
        print()
        print("Count:", count)
    placeholder: |-
      # Use urllib to fetch document and count chars
