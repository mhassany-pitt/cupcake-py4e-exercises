locale: en-US
id: 09-08__dictionaries__exercises01
title: "Commit Day of Week Counter"
description: "Categorize mail messages by day of week committed (3rd word of 'From ' lines) using dictionary."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["dictionaries", "file-io"]
  topics: ["dictionaries", "counting", "file-io"]
runtime:
  language: python
  version: 3
statement: |-
  Write a program that categorizes each mail message by day of week (3rd word of 'From ' line) using a dictionary histogram.
elements:
  - type: editable
    location:
      snippet: |-
        filename = input("Enter a file name: ")
        fhandle = open(filename)
        day_counts = {}
        for line in fhandle:
            if line.startswith("From "):
                words = line.split()
                day = words[2]
                day_counts[day] = day_counts.get(day, 0) + 1
        print(day_counts)
    placeholder: |-
      # Count days of week using a dictionary
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "mbox-short.txt"
    stdout: |-
      Enter a file name: {'Sat': 1, 'Fri': 20, 'Thu': 6}
    console: |-
      {'Sat': 1, 'Fri': 20, 'Thu': 6}
