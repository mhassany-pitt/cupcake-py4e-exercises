locale: en-US
id: 12-12__networked-programs__exercises04
title: "Count Paragraph Tags with BeautifulSoup"
description: "Extract and count paragraph (p) tags from HTML retrieved via urllib."
authors:
  - first: PY4E
    last: Exercise
    email: info@py4e.com
    affiliation: Python for Everybody
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics: ["networking", "urllib"]
  topics: ["networking", "html-parsing", "beautifulsoup"]
runtime:
  language: python
  version: 3
statement: |-
  Use BeautifulSoup to count '<p>' tags in an HTML page retrieved with `urllib` and display the tag count.
elements:
  - type: editable
    location:
      snippet: |-
        import urllib.request
        from bs4 import BeautifulSoup
        url = input("Enter URL: ")
        html = urllib.request.urlopen(url).read()
        soup = BeautifulSoup(html, "html.parser")
        tags = soup('p')
        print("Paragraph tags:", len(tags))
    placeholder: |-
      # Parse HTML with BeautifulSoup and count paragraph tags
testcases:
  - title: Testcase 1
    visible: true
    stdin:
      - "http://data.pr4e.org/romeo.txt"
    stdout: |-
      Enter URL: Paragraph tags: 0
    console: |-
      Paragraph tags: 0
